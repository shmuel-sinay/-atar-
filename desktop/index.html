<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>שולחן עבודה</title>
<style>
:root{--bg:#111827;--bar:#1f2937;--text:#f3f4f6;--muted:#9ca3af;--accent:#2563eb;--ok:#22c55e;--bad:#f87171;--border:#374151}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,"Segoe UI",Arial,sans-serif}
body{display:flex;flex-direction:row}
.side{width:190px;flex:none;display:flex;flex-direction:column;gap:10px;padding:10px;background:var(--bar);border-inline-end:1px solid var(--border);overflow-y:auto}
.side #toggle{padding:9px;font-size:1rem;font-weight:700;border:0;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer}
.side #toggle.on{background:var(--ok);color:#06210f}
#status{font-size:.85rem}
.vol{display:flex;flex-direction:column;gap:4px;color:var(--muted);font-size:.9rem}
.vol b{color:var(--text)}.vol b.hot{color:#fbbf24}
.vol input{width:100%}
.volnote{color:var(--muted);font-size:.75rem;line-height:1.3}
#status{color:var(--muted);font-size:.95rem}
#status.ok{color:var(--ok)}#status.bad{color:var(--bad)}
.kbd{display:flex;flex-direction:column;gap:8px}
.kbd #getclip,.kbd #kreset{padding:9px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-weight:700;cursor:pointer}
.kbd #clipout{width:100%;height:80px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text)}
.kbd input{width:100%;padding:7px 9px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text)}
#kst{color:var(--muted);font-size:.9rem}#kst.ok{color:var(--ok)}#kst.bad{color:var(--bad)}
iframe{flex:1;min-width:0;height:100%;border:0;background:#000}
</style>
</head>
<body>
<aside class="side">
<button id="toggle">כבה קול</button>
<label class="vol">עוצמה <b id="volv">100%</b>
  <input id="vol" type="range" min="0" max="300" step="5" value="100" aria-label="עוצמת הקול">
</label>
<small class="volnote">מעל 100% הקול מוגבר. הגברה גבוהה מדי עלולה לעוות את הצליל.</small>
<span id="status"></span>
<div class="kbd">
  <button id="getclip" type="button">📋 העתק מהשרת</button>
  <button id="kreset" type="button">שחרר מקשים</button>
  <textarea id="clipout" hidden readonly></textarea>
  <input id="kkey" type="password" placeholder="קוד מקלדת (פעם אחת)" autocomplete="off" inputmode="numeric" hidden>
  <span id="kst"></span>
</div>
</aside>
<iframe id="desk" src="/desktop/app/vnc.html?autoconnect=1&resize=scale&reconnect=true" allow="clipboard-read; clipboard-write" title="שולחן עבודה"></iframe>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var ws, ctx, gain, cfg = null, nextTime = 0, on = true, retry, peak = 0;
  var DELAY = 0.15;
  function status(t, kind){ var s = $('status'); s.textContent = t; s.className = kind || ''; }
  // exactly one sound connection per page: a new one closes the old, and only the current one may reconnect
  function connect(){
    clearTimeout(retry);
    if (ws) { var old = ws; ws = null; old.onclose = null; try { old.close(); } catch (e) {} }
    var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    var me = ws = new WebSocket(proto + '//' + location.host + '/kol/ws?role=listener&room=main');
    ws.binaryType = 'arraybuffer';
    ws.onopen = function(){ status(ctx && ctx.state === 'running' ? 'מחובר' : 'לחץ על הדף כדי לשמוע'); };
    ws.onmessage = function(e){
      if (e.data instanceof ArrayBuffer) return play(e.data);
      var m = JSON.parse(e.data);
      if (m.type === 'config') { cfg = m; nextTime = 0; status(ctx && ctx.state === 'running' ? 'קול פעיל' : 'לחץ על הדף כדי לשמוע', 'ok'); }
      if (m.type === 'sender-gone') { cfg = null; status('אין קול מהשרת כרגע'); }
      if (m.type === 'error') status(m.message, 'bad');
    };
    ws.onclose = function(){ if (!on || ws !== me) return; ws = null; status('מתחבר מחדש', 'bad'); retry = setTimeout(connect, 2000); };
  }
  function play(buf){
    if (!cfg || !ctx || ctx.state !== 'running') return;
    var ch = cfg.channels, pcm = new Int16Array(buf), frames = pcm.length / ch;
    if (!frames) return;
    var ab = ctx.createBuffer(ch, frames, cfg.sampleRate);
    for (var c = 0; c < ch; c++) {
      var out = ab.getChannelData(c);
      for (var i = 0; i < frames; i++) { var v = pcm[i * ch + c] / 32768; out[i] = v; }
    }
    var now = ctx.currentTime;
    if (nextTime < now + 0.01) nextTime = now + DELAY;
    else if (nextTime > now + DELAY + 0.25) return;
    var src = ctx.createBufferSource(); src.buffer = ab; src.connect(gain); src.start(nextTime);
    nextTime += ab.duration;
  }
  // browsers allow sound only after a touch: the first click/tap/key anywhere (also inside the desktop) unlocks it
  ctx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
  gain = ctx.createGain(); gain.gain.value = 1; gain.connect(ctx.destination);
  try { var sv = localStorage.getItem('kol-vol'); if (sv !== null) $('vol').value = sv; } catch (e) {}
  function setVol(){ var v = +$('vol').value; gain.gain.value = v / 100; $('volv').textContent = v + '%'; $('volv').className = v > 150 ? 'hot' : ''; try { localStorage.setItem('kol-vol', v); } catch (e) {} }
  $('vol').oninput = setVol; setVol();
  function unlock(){ if (on && ctx.state !== 'running') ctx.resume().then(function(){ if (cfg) status('קול פעיל', 'ok'); }); }
  ['pointerdown', 'keydown', 'touchstart'].forEach(function(ev){ document.addEventListener(ev, unlock, true); });
  window.addEventListener('blur', function(){ setTimeout(unlock, 0); }); // a click inside the desktop frame moves focus to it
  $('toggle').onclick = function(){
    on = !on;
    if (on) { ctx.resume(); connect(); this.textContent = 'כבה קול'; this.className = ''; }
    else { clearTimeout(retry); if (ws) { ws.onclose = null; try { ws.close(); } catch (e) {} ws = null; } ctx.suspend(); cfg = null; status('הקול כבוי'); this.textContent = 'הפעל קול'; this.className = 'on'; }
  };
  connect();
})();
</script>
<script>
// keyboard: every key pressed on the desktop is caught (capture, inside the noVNC frame) and sent to the server
// service on /kbd/ws: plain characters as text (pasted there, so Hebrew works), the rest as key combos.
// The mouse stays with noVNC.
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var ws, q = [], retry, key = '', buf = '', bt;
  try { key = localStorage.getItem('kbd-key') || ''; } catch (e) {}
  function st(t, k){ $('kst').textContent = t; $('kst').className = k || ''; }
  function askKey(){ $('kkey').hidden = false; $('kkey').focus(); st('צריך קוד מקלדת (פעם אחת)', 'bad'); }
  function connect(){
    clearTimeout(retry);
    if (!key) return askKey();
    if (ws) { ws.onclose = null; try { ws.close(); } catch (e) {} }
    var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    var me = ws = new WebSocket(proto + '//' + location.host + '/kbd/ws?key=' + encodeURIComponent(key));
    ws.onopen = function(){ st('מקלדת מחוברת', 'ok'); while (q.length) ws.send(q.shift()); };
    ws.onmessage = function(e){
      var m; try { m = JSON.parse(e.data); } catch (x) { return; }
      if (m.type === 'error') st(m.message || 'שגיאה', 'bad');
      if (m.type === 'clip') gotClip(m.text || '');
    };
    ws.onclose = function(e){
      if (ws !== me) return; ws = null;
      if (e.code === 4001) { key = ''; try { localStorage.removeItem('kbd-key'); } catch (x) {} return askKey(); }
      st('מקלדת: מתחבר מחדש', 'bad'); retry = setTimeout(connect, 2000);
    };
  }
  function raw(o){
    var d = JSON.stringify(o);
    if (ws && ws.readyState === 1) ws.send(d); else { q.push(d); if (!ws) connect(); }
  }
  // fast typing goes over as one piece; a key combo first sends what was typed before it, so order is kept
  function flush(){ clearTimeout(bt); if (buf) { raw({ type: 'type', text: buf }); buf = ''; } }
  function typeChar(c){ buf += c; clearTimeout(bt); bt = setTimeout(flush, 60); }
  function sendKey(k){ flush(); raw({ type: 'key', key: k }); }

  var SPECIAL = { Enter: 'Return', Backspace: 'BackSpace', Delete: 'Delete', Tab: 'Tab', Escape: 'Escape',
    ArrowLeft: 'Left', ArrowRight: 'Right', ArrowUp: 'Up', ArrowDown: 'Down', Home: 'Home', End: 'End',
    PageUp: 'Prior', PageDown: 'Next', Insert: 'Insert' };
  var MODS = ['Control', 'Alt', 'Meta', 'Shift', 'AltGraph', 'CapsLock', 'NumLock', 'OS', 'Dead', 'Process', 'Unidentified'];
  function base(e){
    if (SPECIAL[e.key]) return SPECIAL[e.key];
    if (/^F\d{1,2}$/.test(e.key)) return e.key;
    if (e.key === ' ') return 'space';
    var m = /^Key([A-Z])$/.exec(e.code) || /^Digit(\d)$/.exec(e.code);   // Latin letter even on a Hebrew layout
    if (m) return m[1].toLowerCase();
    return e.key.length === 1 ? e.key.toLowerCase() : '';
  }
  function onKey(e){
    if (MODS.indexOf(e.key) >= 0) { e.preventDefault(); e.stopPropagation(); return; }
    e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();
    var mod = e.ctrlKey || e.altKey || e.metaKey;
    if (!mod && e.key.length === 1) return typeChar(e.key);        // a plain character (Hebrew, English, digit, space)
    var k = base(e); if (!k) return;
    if (k === 'v' && e.ctrlKey && !e.altKey && !e.metaKey && !e.shiftKey) return pasteLocal(e.view);
    var combo = (e.ctrlKey ? 'ctrl+' : '') + (e.altKey ? 'alt+' : '') + (e.metaKey ? 'super+' : '') + (e.shiftKey ? 'shift+' : '') + k;
    sendKey(combo);
  }
  // server clipboard -> this computer
  function gotClip(t){
    var out = $('clipout');
    if (!t) { st('הלוח בשרת ריק', 'bad'); return; }
    navigator.clipboard.writeText(t).then(function(){ out.hidden = true; st('✓ הועתק למחשב', 'ok'); }, function(){
      // the browser refused (the click was too long ago): show the text to copy by hand
      out.value = t; out.hidden = false; out.focus(); out.select(); st('סמן והעתק מהתיבה', 'bad');
    });
  }
  // release stuck Ctrl/Alt/Shift on the server whenever the page loses focus, and on demand
  function reset(){ flush(); if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'reset' })); }
  window.addEventListener('blur', function(){ setTimeout(function(){ if (document.activeElement !== $('desk')) reset(); }, 0); });
  document.addEventListener('visibilitychange', function(){ if (document.hidden) reset(); });
  window.addEventListener('pagehide', reset);
  $('kreset').onclick = function(){ reset(); st('המקשים שוחררו', 'ok'); };
  $('getclip').onclick = function(){ st('מעתיק מהשרת…'); raw({ type: 'getclip' }); };
  // Ctrl+V: paste what was copied on THIS computer (falls back to the server's own paste)
  function pasteLocal(w){
    var cb = (w && w.navigator.clipboard) || navigator.clipboard;
    if (!cb || !cb.readText) return sendKey('ctrl+v');
    cb.readText().then(function(t){ if (t) { flush(); raw({ type: 'type', text: t }); } else sendKey('ctrl+v'); },
                       function(){ sendKey('ctrl+v'); });
  }
  function block(e){ e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation(); }
  function hook(){
    var w; try { w = $('desk').contentWindow; w.document; } catch (e) { return st('לא ניתן לחבר מקלדת לשולחן העבודה', 'bad'); }
    if (w.__kbdHooked) return; w.__kbdHooked = true;
    w.addEventListener('keydown', onKey, true);
    // keyup is NOT blocked: if noVNC ever saw a key go down, it must also see it come up, or Ctrl stays stuck
    w.addEventListener('keypress', block, true);
  }
  $('desk').addEventListener('load', hook);
  hook();
  $('kkey').onkeydown = function(e){
    if (e.key !== 'Enter' || !this.value) return;
    key = this.value; try { localStorage.setItem('kbd-key', key); } catch (x) {}
    this.value = ''; this.hidden = true; connect(); $('desk').focus();
  };
  connect();
})();
</script>
</body>
</html>
