<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>שולחן עבודה</title>
<style>
:root{--bg:#111827;--bar:#1f2937;--text:#f3f4f6;--muted:#9ca3af;--accent:#2563eb;--ok:#22c55e;--bad:#f87171;--border:#374151}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,"Segoe UI",Arial,sans-serif}
body{display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 12px;background:var(--bar);border-bottom:1px solid var(--border)}
.bar button{padding:8px 14px;font-size:1rem;font-weight:700;border:0;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer}
.bar button.on{background:var(--ok);color:#06210f}
.bar input[type=password]{width:110px;padding:7px 9px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:1rem}
.bar input[type=range]{width:110px}
.meter{width:70px;height:8px;border-radius:5px;background:var(--border);overflow:hidden}
.meter>div{height:100%;width:0;background:var(--ok);transition:width .08s linear}
#status{color:var(--muted);font-size:.95rem}
#status.ok{color:var(--ok)}#status.bad{color:var(--bad)}
iframe{flex:1;width:100%;border:0;background:#000}
</style>
</head>
<body>
<div class="bar">
  <button id="toggle">כבה קול</button>
  <label for="vol" style="color:var(--muted)">עוצמה</label>
  <input id="vol" type="range" min="0" max="2" step="0.05" value="1">
  <div class="meter"><div id="level"></div></div>
  <span id="status"></span>
</div>
<iframe id="desk" src="/desktop/app/vnc.html?autoconnect=1&resize=scale&reconnect=true" allow="clipboard-read; clipboard-write" title="שולחן עבודה"></iframe>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var ws, ctx, gain, cfg = null, nextTime = 0, on = true, retry, peak = 0;
  var DELAY = 0.15;
  function status(t, kind){ var s = $('status'); s.textContent = t; s.className = kind || ''; }
  function connect(){
    var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(proto + '//' + location.host + '/kol/ws?role=listener&room=main');
    ws.binaryType = 'arraybuffer';
    ws.onopen = function(){ status(ctx && ctx.state === 'running' ? 'מחובר' : 'לחץ על הדף כדי לשמוע'); };
    ws.onmessage = function(e){
      if (e.data instanceof ArrayBuffer) return play(e.data);
      var m = JSON.parse(e.data);
      if (m.type === 'config') { cfg = m; nextTime = 0; status(ctx && ctx.state === 'running' ? 'קול פעיל' : 'לחץ על הדף כדי לשמוע', 'ok'); }
      if (m.type === 'sender-gone') { cfg = null; status('אין קול מהשרת כרגע'); }
      if (m.type === 'error') status(m.message, 'bad');
    };
    ws.onclose = function(){ if (!on) return; status('מתחבר מחדש', 'bad'); retry = setTimeout(connect, 2000); };
  }
  function play(buf){
    if (!cfg || !ctx || ctx.state !== 'running') return;
    var ch = cfg.channels, pcm = new Int16Array(buf), frames = pcm.length / ch;
    if (!frames) return;
    var ab = ctx.createBuffer(ch, frames, cfg.sampleRate);
    for (var c = 0; c < ch; c++) {
      var out = ab.getChannelData(c);
      for (var i = 0; i < frames; i++) { var v = pcm[i * ch + c] / 32768; out[i] = v; if (v < 0) v = -v; if (v > peak) peak = v; }
    }
    var now = ctx.currentTime;
    if (nextTime < now + 0.01) nextTime = now + DELAY;
    else if (nextTime > now + DELAY + 0.25) return;
    var src = ctx.createBufferSource(); src.buffer = ab; src.connect(gain); src.start(nextTime);
    nextTime += ab.duration;
  }
  // browsers allow sound only after a touch: the first click/tap/key anywhere (also inside the desktop) unlocks it
  ctx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
  gain = ctx.createGain(); gain.gain.value = +$('vol').value; gain.connect(ctx.destination);
  function unlock(){ if (on && ctx.state !== 'running') ctx.resume().then(function(){ if (cfg) status('קול פעיל', 'ok'); }); }
  ['pointerdown', 'keydown', 'touchstart'].forEach(function(ev){ document.addEventListener(ev, unlock, true); });
  window.addEventListener('blur', function(){ setTimeout(unlock, 0); }); // a click inside the desktop frame moves focus to it
  $('toggle').onclick = function(){
    on = !on;
    if (on) { ctx.resume(); connect(); this.textContent = 'כבה קול'; this.className = ''; }
    else { clearTimeout(retry); try { ws.close(); } catch (e) {} ctx.suspend(); cfg = null; status('הקול כבוי'); this.textContent = 'הפעל קול'; this.className = 'on'; }
  };
  $('vol').oninput = function(){ gain.gain.value = +$('vol').value; };
  setInterval(function(){ $('level').style.width = Math.min(100, peak * 100) + '%'; peak = 0; }, 100);
  connect();
})();
</script>
</body>
</html>
