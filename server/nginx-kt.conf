map $http_upgrade $kt_conn { default upgrade; '' close; }
server {
  listen 127.0.0.1:8088;
  root /var/www/kosher-site;
  index index.html;
  absolute_redirect off;
  charset utf-8;

  # static site (each folder has its own index.html)
  location / { try_files $uri $uri/ =404; }
  location /server/ { return 404; }
  location ~ /\. { return 404; }
  location ~ ^/(gen\.py|README\.md)$ { return 404; }
  add_header X-Content-Type-Options nosniff always;

  # community chat (separate audience): static build, never indexed
  location /chat/ { add_header X-Robots-Tag "noindex, nofollow" always; try_files $uri $uri/ =404; }

  # admin panel page (never indexed)
  location /admin/ { add_header X-Robots-Tag "noindex, nofollow" always; add_header X-Content-Type-Options nosniff always; try_files $uri $uri/ =404; }

  # product images uploaded from the admin panel
  location /uploads/ { alias /var/lib/kt-contact/uploads/; expires 7d; add_header Cache-Control "public"; add_header X-Content-Type-Options nosniff always; }

  location /assets/ { expires 7d; add_header Cache-Control "public"; }

  # admin API (image uploads and product data are larger than the contact form)
  location /api/admin/ {
    proxy_pass http://127.0.0.1:8099;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
    client_max_body_size 6m;
  }

  # contact form backend
  location /api/ {
    proxy_pass http://127.0.0.1:8099;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
    client_max_body_size 32k;
  }

  # remote desktop and admin panel (unchanged)
  location = /desktop { return 301 /desktop/; }
  location /desktop/ {
    proxy_pass http://127.0.0.1:6080/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $kt_conn;
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }
  location /websockify {
    proxy_pass http://127.0.0.1:6080/websockify;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $kt_conn;
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }
  location = /panel { return 301 /panel/; }
  location /panel/ {
    proxy_pass https://127.0.0.1:9090;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $kt_conn;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 3600s;
  }
}
