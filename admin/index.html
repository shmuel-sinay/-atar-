<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>ניהול | כושר טק</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/style.css">
<style>
[hidden]{display:none!important}
body{font-size:16px}
.bar{background:var(--green-deep);color:#f4efe0;padding:12px 0}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.bar h1{margin:0;font-size:1.2rem}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0}
.tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 18px;border-radius:999px;font:inherit;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--green);color:#fff;border-color:var(--green)}
.panel{display:none}.panel.on{display:block}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:14px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
label.f{display:grid;gap:4px;font-size:.88rem;color:var(--ink-soft)}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
.act{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.sm{padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.sm.danger{color:#a02a1c;border-color:#e0b4ad}
.thumb{width:84px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:var(--gold-soft)}
.msg{white-space:pre-wrap;word-break:break-word;margin:8px 0 0}
.meta{color:var(--ink-soft);font-size:.85rem}
#status{position:fixed;inset-inline:0;bottom:0;padding:10px 16px;text-align:center;background:var(--green-deep);color:#fff;transform:translateY(100%);transition:transform .2s}
#status.show{transform:none}
#login{max-width:360px;margin:12vh auto;display:grid;gap:12px}
</style>
</head>
<body>
<div id="login" class="box" hidden>
  <h1 style="margin:0">כניסה לניהול</h1>
  <label class="f">סיסמה<input type="password" id="pw" autocomplete="current-password"></label>
  <button class="btn primary" id="go" type="button">כניסה</button>
  <div id="loginmsg" role="status"></div>
</div>

<div id="app" hidden>
  <div class="bar"><div class="wrap"><h1>ניהול האתר</h1>
    <span><a href="/" style="margin-inline-end:14px">לאתר</a><button class="sm" id="out" type="button">יציאה</button></span></div></div>
  <div class="wrap">
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="products" aria-selected="true">מוצרים</button>
      <button role="tab" data-tab="services" aria-selected="false">שירותים ומחירים</button>
      <button role="tab" data-tab="messages" aria-selected="false">הודעות <span id="mcount"></span></button>
    </div>

    <section class="panel on" id="p-products">
      <div id="plist"></div>
      <div class="act"><button class="sm" id="addp" type="button">הוספת מוצר</button>
        <button class="btn primary" id="savep" type="button">שמירה</button></div>
    </section>

    <section class="panel" id="p-services">
      <div class="box"><div class="row" id="slist"></div>
        <p class="meta">הטקסט שיוצג בכל כרטיס שירות באתר (למשל "החל מ-100 ש"ח" או "מחיר סימלי").</p></div>
      <div class="act"><button class="btn primary" id="saves" type="button">שמירה</button></div>
    </section>

    <section class="panel" id="p-messages">
      <div id="mlist"></div>
      <div class="act"><button class="sm" id="reload" type="button">רענון</button></div>
    </section>
  </div>
</div>
<div id="status" role="status" aria-live="polite"></div>

<script>
(function () {
  var SVC = { android: "התאמת אנדרואיד", computers: "מחשבים ו-Office", software: "תוכנות בהתאמה אישית",
              websites: "בניית אתרים", shop: "חנות", request: "בקשת פיתוח" };
  var STATUS = [["in", "במלאי"], ["out", "אזל מהמלאי"], ["order", "בהזמנה מיוחדת"]];
  var data = { products: [], services: {} };
  var $ = function (id) { return document.getElementById(id); };

  function el(tag, props, kids) {
    var e = document.createElement(tag);
    Object.keys(props || {}).forEach(function (k) {
      if (k === "text") e.textContent = props[k]; else if (k === "cls") e.className = props[k]; else e[k] = props[k];
    });
    (kids || []).forEach(function (c) { e.appendChild(c); });
    return e;
  }
  function note(t) {
    var s = $("status"); s.textContent = t; s.classList.add("show");
    clearTimeout(note.t); note.t = setTimeout(function () { s.classList.remove("show"); }, 2500);
  }
  function api(method, url, body) {
    return fetch(url, { method: method, credentials: "same-origin",
      headers: body ? { "Content-Type": "application/json" } : {}, body: body ? JSON.stringify(body) : undefined })
    .then(function (r) {
      if (r.status === 401) { showLogin(); throw new Error("login"); }
      if (!r.ok) throw new Error(String(r.status));
      return r.json();
    });
  }
  function showLogin() { $("app").hidden = true; $("login").hidden = false; $("pw").focus(); }
  function showApp() { $("login").hidden = true; $("app").hidden = false; loadAll(); }

  function field(label, input) { return el("label", { cls: "f", text: label }, [input]); }
  function input(val, on, type) {
    var i = el("input", { type: type || "text", value: val || "" });
    i.addEventListener("input", function () { on(i.value); });
    return i;
  }

  function renderProducts() {
    var box = $("plist"); box.textContent = "";
    data.products.forEach(function (p, idx) {
      var sel = el("select");
      STATUS.forEach(function (s) { var o = el("option", { value: s[0], text: s[1] }); if (s[0] === p.status) o.selected = true; sel.appendChild(o); });
      sel.addEventListener("change", function () { p.status = sel.value; });
      var desc = el("textarea", { rows: 2, value: p.desc || "" });
      desc.addEventListener("input", function () { p.desc = desc.value; });
      var thumb = el("img", { cls: "thumb", alt: "" }); if (p.image) thumb.src = p.image; else thumb.style.visibility = "hidden";
      var file = el("input", { type: "file", accept: "image/*" });
      file.addEventListener("change", function () {
        if (!file.files[0]) return;
        shrink(file.files[0]).then(function (url) { return api("POST", "/api/admin/upload", { data: url }); })
          .then(function (r) { p.image = r.url; renderProducts(); note("התמונה הועלתה, לחץ שמירה"); })
          .catch(function () { note("העלאת התמונה נכשלה"); });
      });
      var vis = el("input", { type: "checkbox", checked: p.visible !== false });
      vis.addEventListener("change", function () { p.visible = vis.checked; });
      var acts = el("div", { cls: "act" }, [
        el("label", { text: " מוצג באתר" }, []),
        btn("▲", function () { move(idx, -1); }), btn("▼", function () { move(idx, 1); }),
        btn("הסרת תמונה", function () { p.image = ""; renderProducts(); }),
        btn("מחיקה", function () { if (confirm("למחוק את \"" + (p.name || "המוצר") + "\"?")) { data.products.splice(idx, 1); renderProducts(); } }, true)
      ]);
      acts.firstChild.insertBefore(vis, acts.firstChild.firstChild);
      box.appendChild(el("div", { cls: "box" }, [
        el("div", { cls: "row" }, [field("שם", input(p.name, function (v) { p.name = v; })),
          field("מחיר", input(p.price, function (v) { p.price = v; })), field("סטטוס", sel)]),
        el("div", { style: "margin-top:10px" }, [field("תיאור", desc)]),
        el("div", { cls: "act" }, [thumb, file]), acts]));
    });
    if (!data.products.length) box.appendChild(el("p", { cls: "meta", text: "אין מוצרים. אפשר להוסיף." }));
  }
  function btn(t, fn, danger) {
    var b = el("button", { type: "button", cls: "sm" + (danger ? " danger" : ""), text: t });
    b.addEventListener("click", fn); return b;
  }
  function move(i, d) {
    var j = i + d; if (j < 0 || j >= data.products.length) return;
    var t = data.products[i]; data.products[i] = data.products[j]; data.products[j] = t; renderProducts();
  }
  function renderServices() {
    var box = $("slist"); box.textContent = "";
    Object.keys(SVC).forEach(function (k) {
      box.appendChild(field(SVC[k], input(data.services[k], function (v) { data.services[k] = v; })));
    });
  }
  function shrink(file) {
    return new Promise(function (res, rej) {
      var img = new Image(), u = URL.createObjectURL(file);
      img.onload = function () {
        var m = 1000, s = Math.min(1, m / Math.max(img.width, img.height));
        var c = document.createElement("canvas"); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u);
        res(c.toDataURL("image/jpeg", 0.85));
      };
      img.onerror = rej; img.src = u;
    });
  }
  function renderMessages(list) {
    var box = $("mlist"); box.textContent = "";
    $("mcount").textContent = list.length ? "(" + list.length + ")" : "";
    list.forEach(function (m) {
      var head = el("div", {}, [el("strong", { text: m.subject || "ללא נושא" }),
        el("span", { cls: "meta", text: "  ·  " + (m.time || "") })]);
      var who = el("div", { cls: "meta", text: (m.name || "") + "  ·  " + (m.contact || "") });
      box.appendChild(el("div", { cls: "box" }, [head, who, el("p", { cls: "msg", text: m.message || "" }),
        el("div", { cls: "act" }, [btn("מחיקה", function () {
          if (!confirm("למחוק את ההודעה?")) return;
          api("POST", "/api/admin/messages/delete", { ids: [m.id] }).then(loadMessages);
        }, true)])]));
    });
    if (!list.length) box.appendChild(el("p", { cls: "meta", text: "אין הודעות." }));
  }
  function loadMessages() { return api("GET", "/api/admin/messages").then(renderMessages); }
  function loadAll() {
    api("GET", "/api/admin/data").then(function (d) {
      data = { products: d.products || [], services: d.services || {} };
      renderProducts(); renderServices();
    });
    loadMessages();
  }
  function save() {
    api("PUT", "/api/admin/data", data).then(function () { note("נשמר"); loadAll(); })
      .catch(function (e) { if (e.message !== "login") note("השמירה נכשלה"); });
  }

  document.querySelectorAll(".tabs button").forEach(function (b) {
    b.addEventListener("click", function () {
      document.querySelectorAll(".tabs button").forEach(function (x) { x.setAttribute("aria-selected", x === b ? "true" : "false"); });
      document.querySelectorAll(".panel").forEach(function (p) { p.classList.toggle("on", p.id === "p-" + b.dataset.tab); });
    });
  });
  $("addp").addEventListener("click", function () {
    data.products.push({ id: "", name: "", desc: "", price: "", status: "in", image: "", visible: true }); renderProducts();
  });
  $("savep").addEventListener("click", save);
  $("saves").addEventListener("click", save);
  $("reload").addEventListener("click", loadMessages);
  $("out").addEventListener("click", function () { api("POST", "/api/admin/logout", {}).then(showLogin).catch(showLogin); });
  function login() {
    $("loginmsg").textContent = "";
    fetch("/api/admin/login", { method: "POST", credentials: "same-origin", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: $("pw").value }) })
    .then(function (r) {
      if (r.ok) { $("pw").value = ""; showApp(); }
      else $("loginmsg").textContent = r.status === 429 ? "יותר מדי ניסיונות, נסה שוב מאוחר יותר." : r.status === 503 ? "הניהול לא מוגדר בשרת." : "סיסמה שגויה.";
    }).catch(function () { $("loginmsg").textContent = "אין חיבור לשרת."; });
  }
  $("go").addEventListener("click", login);
  $("pw").addEventListener("keydown", function (e) { if (e.key === "Enter") login(); });

  fetch("/api/admin/me", { credentials: "same-origin" }).then(function (r) { r.ok ? showApp() : showLogin(); }).catch(showLogin);
})();
</script>
</body>
</html>
